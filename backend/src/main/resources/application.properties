spring.application.name=backend

spring.datasource.url=${PARALLAX_DB_URL:jdbc:postgresql://localhost:5432/parallax}
spring.datasource.username=${PARALLAX_DB_USERNAME:parallax}
spring.datasource.password=${PARALLAX_DB_PASSWORD:parallax}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

parallax.alphavantage.api-key=${ALPHA_VANTAGE_API_KEY:}
parallax.alphavantage.base-url=https://www.alphavantage.co/query
parallax.alphavantage.connect-timeout=5s
parallax.alphavantage.request-timeout=30s
parallax.alphavantage.max-response-size=8MB

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${PARALLAX_COOKIE_SECURE:true}

parallax.auth.claim-username=${PARALLAX_CLAIM_USERNAME:}
parallax.auth.claim-password=${PARALLAX_CLAIM_PASSWORD:}

parallax.auth.registration-enabled=${PARALLAX_REGISTRATION_ENABLED:true}

management.endpoints.web.exposure.include=health