spring.application.name=backend

spring.datasource.url=${PARALLAX_DB_URL:jdbc:postgresql://localhost:5432/parallax}
spring.datasource.username=${PARALLAX_DB_USERNAME:parallax}
spring.datasource.password=${PARALLAX_DB_PASSWORD:parallax}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration

# D-32: caps a single CSV upload well above any realistic daily-bar dataset
# (~80 bytes/row => well over 60k bars at 5MB) while keeping V1's in-memory,
# non-streaming parser (CsvBarParser) bounded.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# D-33 Batch 2: connect/request timeouts and max response size are fixed,
# non-secret HTTP adapter configuration. api-key stays blank unless the
# ALPHA_VANTAGE_API_KEY environment variable is set - a blank key never
# fails startup, only a fetch request (AlphaVantageMarketDataProvider).
parallax.alphavantage.api-key=${ALPHA_VANTAGE_API_KEY:}
parallax.alphavantage.base-url=https://www.alphavantage.co/query
parallax.alphavantage.connect-timeout=5s
parallax.alphavantage.request-timeout=30s
parallax.alphavantage.max-response-size=8MB

# D-37: the JSESSIONID session cookie. HttpOnly and a 30-minute idle
# timeout are fixed; Secure defaults to true (required for a real HTTPS
# deployment) but can be turned off for local http://localhost development
# via PARALLAX_COOKIE_SECURE=false. SameSite=Lax matches the same-origin
# deployment topology (D-37) - no cross-site requests need the cookie.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${PARALLAX_COOKIE_SECURE:true}

# D-37: the startup password-claim mechanism - the only way to set a
# password on a pre-existing, passwordless app_user, such as the seeded
# `dev` row (see docs/decisions.md D-37). Both must be set for anything to
# happen; unset PARALLAX_CLAIM_PASSWORD again after the first successful
# claim rather than leaving a credential in the environment indefinitely.
parallax.auth.claim-username=${PARALLAX_CLAIM_USERNAME:}
parallax.auth.claim-password=${PARALLAX_CLAIM_PASSWORD:}

# D-38: self-registration is on by default, matching a public application -
# set PARALLAX_REGISTRATION_ENABLED=false to turn it off (e.g. during an
# incident, or for a deployment that only ever provisions accounts via the
# D-37 claim mechanism).
parallax.auth.registration-enabled=${PARALLAX_REGISTRATION_ENABLED:true}

# D-37: actuator stays health-only over HTTP - SecurityConfig permits
# exactly this one endpoint anonymously, so nothing else must ever be
# exposed here.
management.endpoints.web.exposure.include=health