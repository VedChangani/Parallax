spring.application.name=backend

spring.datasource.url=${PARALLAX_DB_URL:jdbc:postgresql://localhost:5432/parallax}
spring.datasource.username=${PARALLAX_DB_USERNAME:parallax}
spring.datasource.password=${PARALLAX_DB_PASSWORD:parallax}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration

# D-32: caps a single CSV upload well above any realistic daily-bar dataset
# (~80 bytes/row => well over 60k bars at 5MB) while keeping V1's in-memory,
# non-streaming parser (CsvBarParser) bounded.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
