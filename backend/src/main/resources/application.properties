spring.application.name=backend

spring.datasource.url=${PARALLAX_DB_URL:jdbc:postgresql://localhost:5432/parallax}
spring.datasource.username=${PARALLAX_DB_USERNAME:parallax}
spring.datasource.password=${PARALLAX_DB_PASSWORD:parallax}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration

# D-32: caps a single CSV upload well above any realistic daily-bar dataset
# (~80 bytes/row => well over 60k bars at 5MB) while keeping V1's in-memory,
# non-streaming parser (CsvBarParser) bounded.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# D-33 Batch 2: connect/request timeouts and max response size are fixed,
# non-secret HTTP adapter configuration. api-key stays blank unless the
# ALPHA_VANTAGE_API_KEY environment variable is set - a blank key never
# fails startup, only a fetch request (AlphaVantageMarketDataProvider).
parallax.alphavantage.api-key=${ALPHA_VANTAGE_API_KEY:}
parallax.alphavantage.base-url=https://www.alphavantage.co/query
parallax.alphavantage.connect-timeout=5s
parallax.alphavantage.request-timeout=30s
parallax.alphavantage.max-response-size=8MB