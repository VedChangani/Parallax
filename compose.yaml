name: parallax

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parallax
      POSTGRES_USER: parallax
      POSTGRES_PASSWORD: ${PARALLAX_DB_PASSWORD:-parallax}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PARALLAX_DB_URL: jdbc:postgresql://postgres:5432/parallax
      PARALLAX_DB_USERNAME: parallax
      PARALLAX_DB_PASSWORD: ${PARALLAX_DB_PASSWORD:-parallax}
      PARALLAX_COOKIE_SECURE: ${PARALLAX_COOKIE_SECURE:-false}
      PARALLAX_CLAIM_USERNAME: ${PARALLAX_CLAIM_USERNAME:-}
      PARALLAX_CLAIM_PASSWORD: ${PARALLAX_CLAIM_PASSWORD:-}
      PARALLAX_REGISTRATION_ENABLED: ${PARALLAX_REGISTRATION_ENABLED:-true}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080
          && printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          && grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  frontend:
    build:
      context: frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PARALLAX_PORT:-3000}:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  postgres-data:
