server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The backend accepts CSV uploads up to 5 MB (multipart, plus overhead);
    # nginx's 1 MB default would reject them before they reach it.
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Same-origin API: the browser only ever talks to this server. The backend
    # runs a backtest synchronously, so allow a generous read timeout.
    location /api/ {
        # Re-resolve `backend` through Docker's DNS (a variable defers lookup to
        # request time) so a recreated backend container with a new IP is picked
        # up without restarting this one. The original request URI is forwarded.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Vite emits content-hashed filenames here; a missing one is a real 404,
    # never the SPA fallback.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA routing: any other path (e.g. a refresh on /backtests/1) serves the
    # app shell, which is never cached so a new build is picked up.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
